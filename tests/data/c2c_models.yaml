# Camera 2 Cloud - per-model facts, measured on the cameras' own setup
# pages (09/11/2026, one unit per model: 10.2.0.129, .171, .138, .168,
# .134). Hand-maintained: tests/data/c2c_cameras.yaml is generated per
# unit; this file says what a MODEL's firmware offers.
#
# The tests assert from these lists in both directions. A control or menu
# entry listed here must be on the page, and a known one NOT listed must
# be absent; a firmware change shows up either way as a failure naming
# the model, the unit and this file. Nothing is optional at run time: a
# model that lacks an entry skips the test that needs it, by this record,
# not by what the page happened to show.
#
# How to update: probe the page (tools/explore_app.py is for the web app;
# for a camera, open http://<ip>/cgi-bin/admin/setup_main.cgi in a
# browser with the C2C login), then change the list and say so in the
# register (docs/TEST_REPAIRS.md).

# Entries the tests know about, per page. A model lists the ones its
# firmware shows.
#   menu_entries: setup sub-menu entries that not every model carries
#                 (SMART STREAM, CONFIGURATION BACKUP, CORRIDOR SETTING,
#                 RULES, CONNECT)
#   day_night_controls: labels on CAMERA > DAY&NIGHT SETTINGS
#                 (IR mode, IR strength)
#   image_enhancement_controls: labels on CAMERA > IMAGE ENHANCEMENT
#                 (3D noise reduction, LDC, Mirror, Flip)
#   live_view_controls: labels on the live view page (Zoom, IRIS, Focus,
#                 Auto focus); the fisheye FC-12F-1 has steppers for Zoom,
#                 IRIS and Focus and no Auto focus
#   live_view_buttons: buttons on the live view page (Focus, Calibrate)
#   motion_sensitivity_default: the sensitivity each of the four motion
#                 areas shows on EVENTS > MOTION out of the box
#   rtsp_identifier: the Identifier on NETWORK > RTSP INFORMATION, which
#                 a multi-lens unit suffixes per lens (channel1_1)
models:
  DC-5V-1:
    menu_entries: [SMART STREAM, CONFIGURATION BACKUP, CORRIDOR SETTING, RULES, CONNECT]
    live_view_controls: [Zoom, Focus, Auto focus]
    live_view_buttons: [Focus, Calibrate]
    motion_sensitivity_default: 70
    day_night_controls: [IR mode, IR strength]
    image_enhancement_controls: [3D noise reduction, LDC, Mirror, Flip]
    rtsp_identifier: channel1
  BC-5V-1:
    menu_entries: [SMART STREAM, CONFIGURATION BACKUP, CORRIDOR SETTING, CONNECT]
    live_view_controls: [Zoom, Focus, Auto focus]
    live_view_buttons: [Focus, Calibrate]
    motion_sensitivity_default: 70
    day_night_controls: [IR mode, IR strength]
    image_enhancement_controls: [3D noise reduction, LDC, Mirror, Flip]
    rtsp_identifier: channel1
  BC-5M-1:
    menu_entries: [SMART STREAM, CONFIGURATION BACKUP, CORRIDOR SETTING, RULES, CONNECT]
    live_view_controls: [Zoom, Focus, Auto focus]
    live_view_buttons: [Focus, Calibrate]
    motion_sensitivity_default: 70
    day_night_controls: [IR mode, IR strength]
    image_enhancement_controls: [3D noise reduction, LDC, Mirror, Flip]
    rtsp_identifier: channel1
  FC-12F-1:
    menu_entries: [SMART STREAM, CONFIGURATION BACKUP, CONNECT]
    live_view_controls: [Zoom, IRIS, Focus]
    live_view_buttons: []
    motion_sensitivity_default: 80
    day_night_controls: [IR mode]
    image_enhancement_controls: [3D noise reduction]
    rtsp_identifier: channel1
  MS-20V-1:
    menu_entries: [CORRIDOR SETTING, RULES, CONNECT]
    live_view_controls: [Zoom, Focus, Auto focus]
    live_view_buttons: [Focus, Calibrate]
    motion_sensitivity_default: 70
    day_night_controls: [IR mode]
    image_enhancement_controls: [3D noise reduction, Mirror, Flip]
    rtsp_identifier: channel1_1
