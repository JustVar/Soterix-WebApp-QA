# Tests that are red because of an app defect somebody already knows about.
#
# The run page labels these "Known defect", filters them apart from the
# failures still to be read, and the verdict counts them separately. Add one
# entry per app defect and the run page labels the failure "known" instead
# of "failed". A listed test that PASSES is shown as "Known defect, passed":
# the prompt to retire its entry.
#
# An entry carries `since` (the date the defect was reported), `what` (one
# line in tester language) and one or both of `tests` (test names, as
# `test_name` or `path::test_name` when a name is shared) and `signature`
# (a regular expression matched against the failure's error line, for a
# defect that hits whichever test touched it). No ticket keys here: they
# go stale.
#
# Example:
#   - since: 2026-01-31
#     what: Saving a view never finishes
#     tests:
#       - test_save_view
#     signature: no search job was sent within \d+ s of the click
#
# The list is empty. tests/shared/helpers/known_defects.py reads it.
[]
