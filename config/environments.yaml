# Soterix QA Automation - Environment Configuration
# Passwords are stored in .env file, not here

environments:
  qa:
    base_url: https://qa.example.invalid
    api_base_url: https://qa.example.invalid/v-apiserver
    allow_write: true
    allow_delete: true
    boxes:
      us:
        email_env: QA_US_USER
        password_env: QA_US_PASSWORD
      india:
        email_env: QA_INDIA_USER
        password_env: QA_INDIA_PASSWORD

  staging:
    base_url: https://staging.example.invalid
    api_base_url: https://staging.example.invalid/v-apiserver
    allow_write: true
    allow_delete: false
    boxes:
      us:
        user_key: TEST_AUTO_STAGE
        email: test-auto-stage@soterixsystems.com
        default_site_id: TBD

  preprod:
    base_url: TBD
    api_base_url: TBD
    allow_write: true
    allow_delete: false
    boxes:
      soterix:
        user_key: TBD
        email: TBD
        default_site_id: TBD

  prod:
    base_url: https://app.example.invalid
    api_base_url: https://app.example.invalid/v-apiserver
    allow_write: false
    allow_delete: false
    boxes:
      soterix:
        user_key: TEST_AUTO_PROD
        email: test-auto-prod@soterixsystems.com
        default_site_id: TBD

# Default environment if not specified
default_environment: qa
default_box: us
