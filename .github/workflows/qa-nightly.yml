# QA automation: nightly canary + on-demand smoke probe.
#
# GUARDS (read before editing - each one caps a real cost):
#
# 1. Double-burn guard. This repo is pushed to TWO GitHub orgs
#    (Soterix-Systems + JustVar), so this file exists in both. Without the
#    `if:` below, every scheduled run would fire twice - two quota draws,
#    two QA Touch writes. Scheduled runs execute ONLY in the company repo;
#    manual runs (workflow_dispatch) work anywhere, deliberately.
# 2. `concurrency` stops overlapping runs (a slow run + the next schedule).
# 3. `timeout-minutes` is the hard burn cap per job. The org free plan has
#    2,000 hosted minutes/month SHARED ACROSS ALL ORG REPOS; when they run
#    out, jobs are blocked until the month resets.
# 4. Artifact `retention-days: 7` protects the 500 MB artifact quota -
#    Playwright traces are MBs each.
#
# SELF-HOSTED SWITCH: to run on lab hardware instead of GitHub's machines
# (free minutes, lab-network egress, no reCAPTCHA/datacenter-IP concerns),
# register a runner on an always-on box (Settings > Actions > Runners,
# label it `qa-lab`) and change `runs-on: ubuntu-latest` to
# `runs-on: [self-hosted, qa-lab]`. Everything else stays the same.
#
# SECRETS (Settings > Secrets and variables > Actions) - see docs/CI.md:
#   QATOUCH_API_KEY, QATOUCH_DOMAIN, QATOUCH_PROJECT_ID   (canary + uploads)
#   QA_USER, QA_PASSWORD                                   (smoke login)
# Never set BUG_CREATION_ENABLED in CI.

name: QA nightly

# Each action is pinned to a commit SHA, with its version in the comment beside it.
# A tag moves: `actions/checkout@v4` is whatever that tag points at today, and
# webfactory/ssh-agent is handed a private key. Dependabot reads the comment and
# keeps the pin current, so this costs nothing to maintain.

on:
  # Schedule PAUSED 2026-08-18: automations are not fully built/in use yet,
  # so a nightly canary would watch an API nobody is writing to. Re-enable
  # by uncommenting when scheduled runs begin - the double-burn guard below
  # already covers it.
  # schedule:
  #   - cron: '0 9 * * *'   # 09:00 UTC = 04:00 America/Chicago
  workflow_dispatch:
    inputs:
      target:
        description: 'pytest target for the smoke job (path or file)'
        required: false
        default: 'tests/ui/login'

permissions:
  contents: read

concurrency:
  group: qa-automation
  cancel-in-progress: false

jobs:
  canary:
    name: QA Touch API contract canary
    # Double-burn guard: scheduled runs only in the company org. (Schedule is
    # currently paused; the guard stays so re-enabling it is safe by default.)
    if: github.event_name != 'schedule' || github.repository == 'Soterix-Systems/Soterix-WebApp-QA'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
      - name: Install the canary's dependencies
        run: pip install requests python-dotenv
      - name: Run the contract check
        env:
          QATOUCH_API_KEY: ${{ secrets.QATOUCH_API_KEY }}
          QATOUCH_DOMAIN: ${{ secrets.QATOUCH_DOMAIN }}
          QATOUCH_PROJECT_ID: ${{ secrets.QATOUCH_PROJECT_ID }}
        run: python tools/qatouch_contract_check.py
        # Exit 1 = the vendor changed the API again. GitHub emails the
        # failure by default; the last drift went unnoticed five months.

  smoke:
    name: Smoke probe (manual only until reachability is measured)
    # workflow_dispatch only - this job exists to answer two questions the
    # research left open: can a hosted runner reach the QA tenant, and does
    # login work from a datacenter IP (reCAPTCHA). Promote it to the
    # schedule only after it has passed by hand.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - name: Reachability probe (answers the open question even if tests fail)
        run: |
          echo "HTTP status from the QA tenant:"
          curl -sS -o /dev/null -w '%{http_code}\n' --max-time 30 https://qa.example.invalid
      # requirements.txt names the private shared package over HTTPS. The
      # same read-only deploy key and one-repo rewrite as collect-gate.yml:
      # without them this install fails (found 09/18/2026, before the job
      # had ever run). The secret exists on the company repo only.
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555  # v0.10.0
        with:
          ssh-private-key: ${{ secrets.QA_SHARED_DEPLOY_KEY }}
      - name: Send the shared package over the deploy key
        run: >
          git config --global
          url."git@github.com:Soterix-Systems/SOTERIX-QA-SHARED.git".insteadOf
          "https://github.com/Soterix-Systems/SOTERIX-QA-SHARED.git"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install browser
        # pytest.ini pins --browser-channel chrome, so install branded
        # Chrome, not bundled Chromium.
        run: python -m playwright install --with-deps chrome
      - name: Run the smoke target (no QA Touch upload on a probe run)
        env:
          ENV: qa
          QA_USER: ${{ secrets.QA_USER }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          # through the environment, never pasted into the shell line
          TARGET: ${{ inputs.target }}
        run: python -m pytest "$TARGET" -x
      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: smoke-report
          # no trace zips: a CI login is always fresh, and a trace of it
          # holds the password (the same rule tools/publish_run.py keeps)
          path: |
            reports/
            !reports/**/*.zip
          retention-days: 7
          if-no-files-found: ignore
