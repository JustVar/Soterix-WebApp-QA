name: collect-gate

# The merge gate this repo did not have. Until now the only workflow was
# qa-nightly, which runs on demand, so nothing checked a pull request and a
# broken import reached main and was found by whoever ran the suite next.
#
# Cheap by construction. Collection and setup-plan never execute a test,
# launch a browser, or send a request: the whole suite collects in under two
# seconds. It needs ONE credential, a read-only deploy key for the private
# shared package, and sends no live traffic of any kind. The two suites it does run are offline unit tests of the
# plugins and tools.
#
# This also gives Dependabot something to answer to. A pinned dependency that
# nothing proves on bump is a pin that gets rubber-stamped.

on:
  push:
    branches: [main]
  pull_request:

# This job only checks out and runs tests. qa-nightly.yml beside it already
# scopes its token to read; this should not be looser.
permissions:
  contents: read

concurrency:
  group: collect-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    # Only the company repo holds the QA_SHARED_DEPLOY_KEY secret this gate
    # needs to fetch the private shared package. On the JustVar mirror the
    # ssh-agent step gets an empty key and the run fails, emailing the owner
    # on every push and Dependabot PR. Skip there; the authoritative gate
    # (and Dependabot's real check) runs on the company repo.
    if: github.repository == 'Soterix-Systems/Soterix-WebApp-QA'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # requirements.txt names the shared package over HTTPS, which is what a
      # developer's git already speaks, so `pip install -r requirements.txt`
      # is the only setup step locally. CI has no HTTPS credential for a
      # private repo, so it loads the read-only deploy key below and rewrites
      # that ONE url to SSH. The key cannot push and cannot read this
      # repository. The rewrite is scoped to the single repo on purpose: a
      # blanket github.com rewrite would also catch anything else in this job
      # that clones over HTTPS.
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.QA_SHARED_DEPLOY_KEY }}
      - name: Send the shared package over the deploy key
        run: >
          git config --global
          url."git@github.com:Soterix-Systems/SOTERIX-QA-SHARED.git".insteadOf
          "https://github.com/Soterix-Systems/SOTERIX-QA-SHARED.git"
      - run: pip install -r requirements.txt

      # No `playwright install`. Collection and fixture planning need the
      # python package, not a browser binary, and downloading three browsers
      # would turn a two-second gate into a multi-minute one.
      - name: Imports and fixture wiring, whole repo
        run: |
          pytest --collect-only
          pytest --setup-plan

      # pytest exits 5 on zero collected, so the step above already catches a
      # suite that vanishes. Nothing catches one that SHRINKS. Tests have gone
      # missing here twice: a company-remote merge reverted unopposed files,
      # and the shared-package extraction moved hundreds between repos.
      - name: Collected-test floor
        run: python tools/collect_floor.py

      - name: Offline suites
        run: pytest tests/plugins tests/tools tests/helpers

      # The inventory page is generated from the tests and the mapping; a
      # test that lands without regenerating it leaves the page lying.
      - name: Test inventory is current
        run: python tools/test_inventory.py --check

      # Not `ruff check`, which finds 627 things here and would fail every
      # pull request from day one. This fails only when a FILE gains
      # findings: a bar a change can pass, that still stops the count
      # growing. See tools/lint_baseline.py for why per-file, and for the
      # bug that hid in a file holding 50 findings.
      - name: Lint, against the recorded baseline
        run: python tools/lint_baseline.py

      # A shim that stops being a module alias breaks silently: the repo's
      # own suites stay green while every monkeypatch seam quietly stops
      # reaching the running code. Skipped until the shims land in step 6.
      - name: Shim guards
        if: hashFiles('tests/plugins/test_shims.py') != ''
        run: pytest tests/plugins/test_shims.py

  # A shim is a module alias, and aliasing is import-system behaviour. The
  # gate above pins ONE interpreter, so until this job the guards had only
  # ever run on that one, and no interpreter had run both repos' shims: the
  # UI gate is on 3.14 and the API gate on 3.12, while the package claims
  # >=3.11 and proves it across 3.11 to 3.14. This closes step 0 of the
  # foundations plan, which does not close without it.
  #
  # Only the shim guards, not the whole gate. Running everything four times
  # buys little and costs four times as much; what varies by interpreter
  # here is module identity, patch reachability and CLI dispatch, and those
  # are exactly what the guards assert.
  #
  # fail-fast is off on purpose. "3.11 broke" and "every version broke" are
  # different diagnoses and a cancelled matrix cannot tell them apart.
  shim-matrix:
    # Same as collect: the deploy-key secret only exists on the company repo.
    if: github.repository == 'Soterix-Systems/Soterix-WebApp-QA'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.QA_SHARED_DEPLOY_KEY }}
      - name: Send the shared package over the deploy key
        run: >
          git config --global
          url."git@github.com:Soterix-Systems/SOTERIX-QA-SHARED.git".insteadOf
          "https://github.com/Soterix-Systems/SOTERIX-QA-SHARED.git"
      - run: pip install -r requirements.txt
      - name: Shim guards on ${{ matrix.python-version }}
        run: pytest tests/plugins/test_shims.py
