name: collect-gate

# The merge gate. Every push to main and every pull request runs it, and a
# push is not done until it is green. docs/CI.md explains each step.
#
# Cheap by construction. Collection and setup-plan never execute a test,
# launch a browser, or send a request. The two suites it runs are offline
# unit tests of the plugins, tools and helpers. One job, on GitHub's
# machines, with no secret and no repository variable: the shared package
# is a wheel under vendor/, so `pip install -r requirements.txt` is the
# whole setup, here and on a laptop.
#
# `runs-on` is the literal ubuntu-latest on purpose. An expression that
# could resolve to the label of a machine of your own queues every push for
# 24 hours when that machine is off, and GitHub then cancels it with no red
# X and no email. If a machine of your own is ever reconsidered, a pull
# request must still go to GitHub's machines: a workflow file is part of the
# branch, so anyone who can open a pull request could otherwise run their
# own code on that machine.
#
# Each action is pinned to a commit SHA, with its version in the comment
# beside it. A tag moves: `actions/checkout@v4` is whatever that tag points
# at today. While the repo was in use, Dependabot read the comment and kept
# the pin current.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# This job only checks out and runs tests. The token stays read-only.
permissions:
  contents: read

concurrency:
  group: collect-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      # Every pytest step writes its html report under logs/, never to
      # reports/report.html, which a collect-only run would otherwise
      # replace with an empty shell. No cache dir on a throwaway machine.
      PYTEST_ADDOPTS: "--html=logs/ci.html -p no:cacheprovider"
      # The offline suites change nothing a live UI run writes: no run
      # archive, no single-run lock, no screenshots. Same as the hook.
      RUN_ARCHIVE: "off"
      RUN_GUARD: "off"
      REPORT_SCREENSHOTS: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The whole history: the conventions step diffs this push against
          # its base, and the commit-message step reads every commit it brings.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      # The shared package comes from vendor/ through the --find-links line
      # in requirements.txt. Nothing here reaches a private repo.
      - run: pip install -r requirements.txt

      # No `playwright install`. Collection and fixture planning need the
      # python package, not a browser binary, and downloading three browsers
      # would turn a two-second gate into a multi-minute one.
      - name: Imports and fixture wiring, whole repo
        run: |
          pytest --collect-only
          pytest --setup-plan

      # pytest exits 5 on zero collected, so the step above already catches a
      # suite that vanishes. Nothing catches one that SHRINKS. Tests have gone
      # missing here twice: a company-remote merge reverted unopposed files,
      # and the shared-package extraction moved hundreds between repos.
      - name: Collected-test floor
        run: python tools/collect_floor.py

      # The pins for the plugins, tools and helpers, including the shim
      # guards (test_shims.py) and the shared package pin
      # (test_shared_package_pin.py). A shim that stops being a module alias
      # breaks silently, and a wheel that drifts from requirements.txt makes
      # two machines test two pipelines.
      - name: Offline suites
        run: pytest tests/plugins tests/tools tests/helpers

      # The inventory page is generated from the tests and the mapping; a
      # test that lands without regenerating it leaves the page lying.
      - name: Test inventory is current
        run: python tools/test_inventory.py --check

      # Any finding fails. The rule set is in pyproject.toml.
      - name: Lint
        run: python -m ruff check .

      # The house conventions on the lines this push adds: the same check
      # the pre-commit hook runs on staged lines, so a commit made without
      # the hook (a clone that never ran `git config core.hooksPath
      # tools/hooks`) meets it here. The base is the push's previous head,
      # or the pull request's target. secret_check stays hook-only: its
      # secrets are the values in a developer's .env, which this machine
      # does not have.
      - name: House conventions on the added lines
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          case "$base" in ""|0000000000000000000000000000000000000000) base="HEAD~1" ;; esac
          git rev-parse -q --verify "$base^{commit}" > /dev/null || base="HEAD~1"
          echo "base: $base"
          python tools/convention_check.py --base "$base"

      # The attribution gate on every commit this push brings, run as the
      # tracked hook itself (tools/hooks/commit-msg) so the two cannot drift.
      - name: Commit messages name no AI tool, model or co-author
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          case "$base" in ""|0000000000000000000000000000000000000000) base="HEAD~1" ;; esac
          git rev-parse -q --verify "$base^{commit}" > /dev/null || base="HEAD~1"
          echo "base: $base"
          rc=0
          for sha in $(git rev-list "$base..HEAD"); do
            # RUNNER_TEMP, not a fixed /tmp path: a machine that is reused
            # between jobs can hold a file another user left there, and the
            # write then fails with "Permission denied".
            msg="${RUNNER_TEMP:-/tmp}/commit-msg-$sha.txt"
            git log -n 1 --format=%B "$sha" > "$msg"
            sh tools/hooks/commit-msg "$msg" || { echo "  in commit $sha"; rc=1; }
            rm -f "$msg"
          done
          exit $rc
