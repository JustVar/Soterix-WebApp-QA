[pytest]
addopts = -q --browser chromium --browser-channel chrome --html=reports/report.html --self-contained-html --tracing=retain-on-failure --screenshot=only-on-failure --output=reports/artifacts --dist loadgroup --timeout=600
# --timeout=600: every run has a per-test cap, not only the nightly (which passes its own and
# wins). A bare `pytest` or run.py run had none, and one stuck browser call hung it for good
# (failure-mode audit 09/18/2026). On Windows the method is `thread`: the process ends, which
# under -n reads as a crashed worker, and plugins/xdist_recovery.py makes that one failure.
# The -q above is why no pytest command in this repo should add its own.
# Two -q flags mean -qq, which suppresses the "N passed" summary line
# entirely, so a run that collected 12 tests and one that collected 597
# look the same in a CI log. tools/collect_floor.py watches the count
# instead of trusting the eye.
# Bare `pytest` collects only tests/. norecursedirs matches BASENAMES, so a
# plain `tools` entry here also silently skipped tests/tools/ - the client
# regression pins ran green-by-absence for a day before that was caught.
# The repo-root tools/ dir is excluded by testpaths instead.
testpaths = tests
norecursedirs = legacy legacy-selenium-tests

# Markers for test selection
markers =
    hardware: Tests targeting hardware/integration with devices
    software: Tests targeting software-only flows
    ai: Tests exercising AI/ML components
    smoke: Fast critical-path smoke tests
    sanity: Sanity checks for key features
    regression: Full regression suite
    api: API tests
    ui: Playwright UI/browser tests
    slow: Long-running tests (> 30 seconds)
    intermittent: May fail intermittently (drag/drop, animations, a stream that loads late). A label only; a failure stays a failure. Never `flaky`: that name is pytest-rerunfailures' own and retries on any failure, even bare (CONVENTIONS.md > Reruns)
    wip: Work in progress (skip in CI)
    dragdrop: Tests using drag and drop operations
    subtabs: Tests for subtab navigation
    livestream: Needs a playing tile. The session guard in conftest.py measures the box's test camera once (frames on the media socket, and whether this browser decodes the codec it streams) and skips these with the measurement when either fails (STREAM_GUARD=off runs them anyway)
    checkbox: Tests using checkbox selection pattern
    views_devices: Views > Devices subtab tests
    views_myviews: Views > My Views subtab tests
    views_maps: Views > Maps subtab tests
    views_channels: Views > Channels subtab tests
    views_insights: Views > Insights subtab tests
    fullscreen: Tests for full screen video player mode
    bookmark: Tests for bookmark operations (create, rename, export, share, delete)
    views_fullscreen: Views > Full Screen subtab tests
    views_playback: Views deeper playback controls and fullscreen behavior tests
    events: Tests for Events page functionality
    events_search: Events search and filtering tests
    events_playback: Events video review and export tests
    events_filters: Events deeper filter variations and combinations
    search: Global Search page tests
    search_filters: Search page filter and navigation tests
    search_deeper: Search deeper category, duration, and filter combination tests
    search_drawing: Search page zone/line drawing tests
    media: Media page tests (navigation, clips, folders, vault)
    media_deeper: Media deeper tests (date filters, view toggle, tab switching, search)
    insights: Insights page tests (system status, widgets)
    maps: Maps page tests (site selection, camera overlay, stream playback)
    maps_deeper: Maps deeper site dropdown, card details, and camera overlay tests
    notifications: Notification tests (mute, clear, admin rule mute)
    notifications_deeper: Deeper notification panel content, toggle, and navigation tests
    admin: Admin page tests (users, sites, rules)
    admin_general: Admin General section navigation, audit trail, event wall tests
    admin_users: Admin Users page tests (CRUD, roles, status)
    admin_rules: Admin Rules page tests (CRUD, notifications, search)
    admin_sites: Admin Sites page tests (navigation, camera groups, sorting)
    xdist_group: pytest-xdist: run every test sharing this group name on one worker (--dist loadgroup); the account_search group serialises the searching tests (register row 78)
    chats: Chat panel tests (group CRUD, messaging)
    chats_deeper: Chat deeper tests (panel toggle, search, cross-page behavior)
    sequences: Camera sequence tests (CRUD, views integration, advanced options)
    incamera_search: In-camera forensic search tests (filters, play results)
    favorites: Favorites panel tests (add/remove camera favorites)
    share_live: Share live view tests (email share, copy link)
    logout: Logout and session termination tests
    admin_audit_trail: Admin Audit Trail table, records, pagination, and navigation tests
    admin_event_wall: LEGACY alias - Event Wall tests moved to the event_wall/event_wall_display marks (08/13/2026 split)
    event_wall: Event Wall feature tests - its own surface, distinct from regular Views/Events (config via regular login)
    event_wall_display: Event Wall live display tests (special local-access login; held until that account is provisioned)
    insights_dashboard: Insights dashboard sections, preset/my dashboards, creation flow
    licenses: License module tests (navigation, assignment, search, permissions)
    destructive: Interrupts or reboots real hardware. Skipped unless --run-destructive is passed
    mutating: Writes settings to real hardware and restores them afterwards
    lpr: License Plate Recognition module tests
    security: Security-focused checks (auth boundaries, session handling)
    c2c_hardware: Cloud-to-cloud tests that require real hardware attached
    qatouch(case_key): Maps this test to a QA Touch case key for result reporting
    qatouch_project(project_key): Overrides the QA Touch project key for this test (sibling of qatouch marker)
