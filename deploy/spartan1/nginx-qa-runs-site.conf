# The QA run archive over HTTPS. Lives on the box at
# /etc/nginx/sites-available/qa-runs, linked from sites-enabled.
# Installed by deploy/spartan1/setup-https-archive.sh (Soterix-WebApp-QA).
#
# A site of its own, on a port of its own: the asset tracker's site on 8443
# belongs to the asset tracker's repo, and its deploy writes that file again.
# The certificate is the box's mkcert certificate, which the asset tracker
# already uses. It names spartan1 and 10.2.0.2, and the team trusts its CA
# (the asset tracker repo, docs/CA_CERT_DISTRIBUTION.md).
#
# Why HTTPS: the archive uses basic auth, and over plain HTTP each request
# carried the password in clear text on the lab network.
server {
	listen 8444 ssl http2;
	listen [::]:8444 ssl http2;
	server_name _;

	ssl_certificate     /etc/ssl/asset-tracker/asset-tracker.crt;
	ssl_certificate_key /etc/ssl/asset-tracker/asset-tracker.key;
	ssl_protocols       TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;

	# A dot name is never served, at any depth: the hidden temp of a publish
	# (.pub-tmp-*, .pub-old-*), the scan marker, a stray .env.
	location ~ ^/qa-runs/(.*/)?\. {
		deny all;
		return 404;
	}
	location /qa-runs/ {
		alias /data/qa/runs/;
		auth_basic "Soterix QA runs";
		auth_basic_user_file /etc/nginx/.htpasswd-qa;
		index index.html;
		autoindex on;
		autoindex_exact_size off;
		autoindex_localtime on;
	}
	location = / {
		return 301 /qa-runs/;
	}
}
