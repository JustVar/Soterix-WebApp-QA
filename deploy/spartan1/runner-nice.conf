[Unit]
Wants=network-online.target

[Service]
# The nightly owns this box at 09:00 UTC. CI is offline unit tests and must yield to it.
CPUWeight=20
IOWeight=20
MemoryHigh=1500M
MemoryMax=3G
# A crash or an OOM kill left CI silently dead until somebody noticed (audit 09/22/2026).
Restart=always
RestartSec=10
