# The /qa-runs/ locations of the port 80 site on spartan1. They live inside
# /etc/nginx/sites-enabled/default, in the server block. This file is the copy of record.
#
# A dot name is never served, at any depth: the hidden temp of a publish
# (.pub-tmp-*, .pub-old-*), the scan marker, a stray .env.
	location ~ ^/qa-runs/(.*/)?\. {
		deny all;
		return 404;
	}

	# The index polls live.json every few seconds. While no run is live the file
	# is not there, and every poll was a 404 in the log: 207 from 1 reader in 4
	# days (09/28/2026). An empty record is the true answer, not an error.
	location = /qa-runs/live.json {
		alias /data/qa/runs/live.json;
		satisfy any;
		allow 10.2.0.0/24;
		deny all;
		auth_basic "Soterix QA runs";
		auth_basic_user_file /etc/nginx/.htpasswd-qa;
		default_type application/json;
		try_files "" @nolive;
	}
	location @nolive {
		default_type application/json;
		return 200 "{}";
	}

	location /qa-runs/ {
		alias /data/qa/runs/;
		# From the lab or the VPN subnet, no password: the archive is read by the
		# people on that network and by nobody else, and the login prompt on the
		# Slack link is why 1 request reached the archive in the 3 days after the
		# posts began (09/28/2026). From anywhere else the login still applies.
		# The auth was added on 09/18 when trace zips carried session cookies;
		# traces are no longer published and the scan masks secrets, so the
		# subnet is the line now, and the login is the line behind it.
		satisfy any;
		allow 10.2.0.0/24;
		deny all;
		auth_basic "Soterix QA runs";
		auth_basic_user_file /etc/nginx/.htpasswd-qa;
		index index.html;
		autoindex on;
		autoindex_exact_size off;
		autoindex_localtime on;
	}
