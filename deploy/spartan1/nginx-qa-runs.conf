# The /qa-runs/ locations of the port 80 site on spartan1. They live inside
# /etc/nginx/sites-enabled/default, in the server block. This file is the copy of record.
#
# A dot name is never served, at any depth: the hidden temp of a publish
# (.pub-tmp-*, .pub-old-*), the scan marker, a stray .env.
	location ~ ^/qa-runs/(.*/)?\. {
		deny all;
		return 404;
	}

	location /qa-runs/ {
		alias /data/qa/runs/;
		auth_basic "Soterix QA runs";
		auth_basic_user_file /etc/nginx/.htpasswd-qa;
		index index.html;
		autoindex on;
		autoindex_exact_size off;
		autoindex_localtime on;
	}
